version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-runtime:
        patterns:
          - fastapi
          - starlette
          - uvicorn
          - httpx
          - pydantic
          - hvac
          - PyYAML
      pip-otel:
        patterns:
          - opentelemetry-*
      pip-dev:
        patterns:
          - ruff
          - pytest
          - pytest-*
          - pip-audit
          - coverage
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # Keep Docker base major bumps reviewable one-at-a-time; CI uses setup-python 3.14.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
