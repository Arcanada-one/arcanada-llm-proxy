name: Production deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact main commit published by successful CI
        required: true
        type: string
      image_digest:
        description: Exact sha256 digest emitted by that CI run
        required: true
        type: string
      ci_run_id:
        description: Successful main CI run that published the image
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-arcanada-llm-proxy-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: [self-hosted, linux, arcana-devs]
    timeout-minutes: 3
    steps:
      - name: Require exact successful main CI run
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CI_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]]
          test "${GITHUB_REF}" = refs/heads/main
          test "${GITHUB_SHA}" = "${RELEASE_SHA}"
          run_json="$(curl --fail --silent --show-error --noproxy '*' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          jq -e --arg release "${RELEASE_SHA}" \
            '.head_sha == $release and .head_branch == "main" and
             .event == "push" and .status == "completed" and
             .conclusion == "success" and .path == ".github/workflows/ci.yml"' \
            <<<"${run_json}" >/dev/null
      - name: Download CI-bound publication identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: llm-proxy-image-${{ inputs.release_sha }}
          path: ci-publication
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.ci_run_id }}
      - name: Match exact published digest
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(find ci-publication -type f | wc -l)" -eq 1
          jq -e --arg release "${RELEASE_SHA}" --arg digest "${IMAGE_DIGEST}" \
            '.release_sha == $release and .image_digest == $digest' \
            ci-publication/published-image.json >/dev/null

  cutover:
    needs: [guard]
    environment: production
    runs-on: [self-hosted, linux, arcana-prod-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout exact main release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.release_sha }}
          persist-credentials: false
      - name: Verify installed root boundary
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          helper_sha="$(sha256sum deploy/llm_proxy_deploy.py | cut -d' ' -f1)"
          service_sha="$(sha256sum \
            deploy/arcanada-llm-proxy-rollback@.service | cut -d' ' -f1)"
          timer_sha="$(sha256sum \
            deploy/arcanada-llm-proxy-rollback@.timer | cut -d' ' -f1)"
          test "$(stat -c '%U:%G:%a' \
            /usr/local/sbin/arcanada-llm-proxy-deploy)" = root:root:755
          test "$(sha256sum /usr/local/sbin/arcanada-llm-proxy-deploy |
            cut -d' ' -f1)" = "${helper_sha}"
          sudo -n /usr/local/sbin/arcanada-llm-proxy-deploy verify-bundle \
            "${helper_sha}" "${service_sha}" "${timer_sha}"
          sudo -n /usr/local/sbin/arcanada-llm-proxy-deploy preflight
      - name: Cut over exact digest
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          DEPLOY_CAPABILITY: ${{ secrets.LLM_PROXY_DEPLOY_CAPABILITY }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "${DEPLOY_CAPABILITY}" |
            sudo -n /usr/local/sbin/arcanada-llm-proxy-deploy deploy \
              "${RELEASE_SHA}" \
              "${IMAGE_DIGEST}" \
              "${CI_RUN_ID}"

  finalize:
    if: always()
    needs: [guard, cutover]
    environment: production
    runs-on: [self-hosted, linux, arcana-prod-ci]
    timeout-minutes: 10
    steps:
      - name: Commit green release or restore old container
        env:
          CUTOVER_RESULT: ${{ needs.cutover.result }}
          DEPLOY_CAPABILITY: ${{ secrets.LLM_PROXY_DEPLOY_CAPABILITY }}
          GUARD_RESULT: ${{ needs.guard.result }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [ "${GUARD_RESULT}" != success ]; then
            printf 'CI provenance guard failed; no production action was authorized\n' >&2
            exit 1
          fi
          if [ "${CUTOVER_RESULT}" != success ]; then
            if sudo -n /usr/local/sbin/arcanada-llm-proxy-deploy \
              status "${RELEASE_SHA}" >/dev/null 2>&1; then
              printf '%s\n' "${DEPLOY_CAPABILITY}" |
                sudo -n /usr/local/sbin/arcanada-llm-proxy-deploy \
                  rollback "${RELEASE_SHA}"
            fi
            exit 1
          fi
          if ! sudo -n /usr/local/sbin/arcanada-llm-proxy-deploy \
            health "${RELEASE_SHA}"; then
            printf '%s\n' "${DEPLOY_CAPABILITY}" |
              sudo -n /usr/local/sbin/arcanada-llm-proxy-deploy \
                rollback "${RELEASE_SHA}"
            exit 1
          fi
          printf '%s\n' "${DEPLOY_CAPABILITY}" |
            sudo -n /usr/local/sbin/arcanada-llm-proxy-deploy commit \
              "${RELEASE_SHA}"
          sudo -n /usr/local/sbin/arcanada-llm-proxy-deploy \
            status "${RELEASE_SHA}"
