name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: [self-hosted, linux, arcana-ai, docker, ci-general]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app/ deploy/ tests/
      - run: pytest --cov=app --cov-report=term
      - run: pip-audit --strict -r requirements.txt
      - name: Validate deploy shell and workflow contracts
        run: |
          set -euo pipefail
          shellcheck -S warning deploy/*.sh
          pytest -q tests/test_deploy_broker.py tests/test_deploy_workflow_contract.py

  network-exposure:
    uses: Arcanada-one/datarim/.github/workflows/network-exposure-lint.yml@82311756b4dbfd16ddc96e098829bd9b0dea3626 # PR #246 2026-07-26
    with:
      compose_paths: docker-compose.yml
      datarim_ref: '82311756b4dbfd16ddc96e098829bd9b0dea3626'
      runner_labels: '["self-hosted","linux","ci-general"]'

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-test, network-exposure]
    runs-on: [self-hosted, linux, arcana-ai, docker, ci-general]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    concurrency:
      group: publish-arcanada-llm-proxy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish exact image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ghcr.io/arcanada-one/arcanada-llm-proxy:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            io.arcanada.release_sha=${{ github.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable publication identity
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -n --arg release "${RELEASE_SHA}" --arg digest "${IMAGE_DIGEST}" \
            '{release_sha: $release, image_digest: $digest}' > published-image.json
      - name: Upload immutable publication identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: llm-proxy-image-${{ github.sha }}
          path: published-image.json
          if-no-files-found: error
          retention-days: 7

  verify-published-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-image]
    runs-on: [self-hosted, linux, arcana-ai, docker, ci-general]
    timeout-minutes: 10
    permissions:
      packages: read
    concurrency:
      group: verify-published-arcanada-llm-proxy
      cancel-in-progress: false
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and verify exact registry artifact
        env:
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.digest }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/arcanada-one/arcanada-llm-proxy@${IMAGE_DIGEST}"
          docker pull "${image}"
          test "$(docker image inspect --format \
            '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
            "${image}")" = "${RELEASE_SHA}"
          test "$(docker image inspect --format \
            '{{ index .Config.Labels "io.arcanada.release_sha" }}' \
            "${image}")" = "${RELEASE_SHA}"
